<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Activity fixture</title>
<link id="site-icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23233553'/%3E%3Cpath d='M10 22V10h7a4 4 0 0 1 0 8h-7m6 0 6 4' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
body { margin: 0; padding: 64px; background: #10191d; color: #deebe8; font: 16px system-ui; }
main { max-width: 680px; margin: auto; }
h1 { font-size: 36px; letter-spacing: -.04em; }
p { color: #a4bdb6; line-height: 1.7; }
button { padding: 12px 20px; border: 1px solid #3d665b; border-radius: 10px; background: #1b3931; color: #d3f9ec; font: inherit; }
</style>
<main>
  <p>Browser Relay</p>
  <h1>A clear signal for work in progress.</h1>
  <p>The website title stays intact. A soft multicolor glow wraps the page edge while Browser Relay is working. The site icon carries a green status dot. Both effects clear when the task ends.</p>
  <button id="complete" onclick="document.querySelector('#ready').hidden=false">Complete task</button>
  <p id="ready" hidden>Task complete</p>
</main>
</html>
